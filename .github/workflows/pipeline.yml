name: Pipeline
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Copia workspace
        uses: actions/checkout@v4

      - name: Instalacao do Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verifica se o pip está instalado
        run: pip --version

      - name: Instala o pycodestyle
        run: pip install pycodestyle