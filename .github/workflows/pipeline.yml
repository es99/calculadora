name: Pipeline
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Copia workspace
        uses: actions/checkout@v4

      - name: Instalacao do Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verifica se o pip está instalado
        run: pip --version

      - name: Instala o pycodestyle e pydocstyle
        run: pip install pycodestyle pydocstyle

      - name: Verifica estilo e documentacao do codigo
        run:
          pycodestyle calc.py
          pydocstyle calc.py